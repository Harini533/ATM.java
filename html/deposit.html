<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cash Deposit</title>

    <link rel="stylesheet" href="../css/deposit.css">
</head>

<body>
    <img src="../images/atm.jpg" alt="ATM Background" class="background-image">

    <div class="deposit-container">

        <img src="../images/atm.png1.webp" alt="ATM Logo" class="logo">

        <h1>Secure Bank ATM</h1>
        <h2>Cash Deposit</h2>

        <hr>

        <div class="bank-details">

            <p><strong>Bank Name :</strong> HDFC Bank</p>

            <p><strong>Branch :</strong> Main Branch</p>

            <p><strong>Location :</strong> Sector 18, Noida</p>

        </div>

        <hr>

        <form>

            <label for="amount">
                Enter Deposit Amount
            </label>

            <input
                type="number"
                id="amount"
                placeholder="Enter Amount"
                min="100"
                required>

            <button
                type="button"
                onclick="depositCash()">Deposit Cash</button>

            <button type="reset">
                Clear
            </button>
             <p id="message"></p>

            <button
                type="button"
                onclick="window.location.href='dashboard.html'">

                Back

            </button>

        </form>

       

        <hr>

        <div class="date-time">

            <p><strong>Date :</strong>
                <span id="date"></span>
            </p>

            <p><strong>Time :</strong>
                <span id="time"></span>
            </p>

        </div>

    </div>

    <script src="../js/deposit.js"></script>

</body>

</html>
