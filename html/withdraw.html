<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cash Withdrawal</title>

    <link rel="stylesheet" href="../css/withdraw.css">
</head>

<body>
    <img src="../images/atm.jpg" alt="ATM Background" class="background-image">

    <div class="withdraw-container">
        <img src="../images/atm.png1.webp" alt="ATM Logo" class="logo">

        <h1>Cash Withdrawal</h1>

        <form>
            <label for="card_number">Card Number</label>
            <input type="text" id="card_number" placeholder="Enter Card Number"><br><br>
            <label for="amount">Enter Amount</label>
            <input type="number"  id="amount"placeholder="Enter Amount"><br><br>
            <button type="button" onclick="withdrawCash()">Withdraw</button><br><br>
            <button type="reset">Clear</button>
            <button type="button"  onclick="window.location.href='dashboard.html'"> Back </button>
        </form>
        <p id="message"></p>

    </div>

    <script src="../js/withdraw.js"></script>

</body>

</html>
